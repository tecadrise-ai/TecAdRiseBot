<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <style>
    .card { fill: #ffffff; stroke: #e3e3e6; stroke-width: 1; }
    .title { font-size: 16px; font-weight: 600; fill: #1a1a1a; }
    .sub { font-size: 14px; fill: #6b6b70; }
    .col { font-size: 14px; fill: #6b6b70; text-anchor: middle; }
    .arrow { fill: none; stroke: #6b6b70; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .lname { font-size: 13px; }
    .ldesc { font-size: 12px; text-anchor: end; }
    .sect { font-size: 12px; font-weight: 600; fill: #6b6b70; letter-spacing: 0.02em; }
    .blue rect { fill: #dbe6fd; } .blue text { fill: #1e3a8a; }
    .purple rect { fill: #e8e6fb; } .purple text { fill: #4c3f91; }
    .orange rect { fill: #fbdccc; } .orange text { fill: #9a3412; }
    .legend { font-size: 13px; fill: #3a3a3f; }
    [data-tip] { cursor: help; }
    [data-doc] { cursor: pointer; }
    [data-doc]:hover .lname { text-decoration: underline; }
    [data-tip]:hover rect { stroke: #1d4ed8; stroke-width: 1.5; }
  </style>

  <rect width="1200" height="640" fill="#f6f6f7"/>

  <g transform="translate(40 24)">
    <rect x="0" y="-10" width="11" height="11" rx="3" fill="#3b6fe0"/><text class="legend" x="18" y="0">App-wide</text>
    <rect x="108" y="-10" width="11" height="11" rx="3" fill="#8b80e0"/><text class="legend" x="126" y="0">This agent</text>
    <rect x="210" y="-10" width="11" height="11" rx="3" fill="#e8743b"/><text class="legend" x="228" y="0">This message</text>
  </g>

  <text class="col" x="185" y="58">Starts a turn</text>
  <g data-tip="You type in chat. One agent, one in-flight turn.">
    <rect class="card" x="40" y="70" width="290" height="72" rx="12"/>
    <text class="title" x="60" y="98">You</text><text class="sub" x="60" y="122">Chat message</text>
  </g>
  <g data-tip="Per-agent schedule. Task, todos, or a step workflow with this agent as Runner.">
    <rect class="card" x="40" y="154" width="290" height="72" rx="12"/>
    <text class="title" x="60" y="182">Routine</text><text class="sub" x="60" y="206">Schedule, workflow</text>
  </g>
  <g data-tip="Host tool message_agent. Waits for { reply }. Target must be idle. Do not curl.">
    <rect class="card" x="40" y="238" width="290" height="72" rx="12"/>
    <text class="title" x="60" y="266">Other agent</text><text class="sub" x="60" y="290">message_agent</text>
  </g>
  <g data-tip="http://127.0.0.1:8787, local only. GET /api catalog. GET /api/awareness is JSON holdings (names, no values). GET /api/secrets lists names. GET /api/secrets/NAME is 403. Secrets stay in the host.">
    <rect class="card" x="40" y="322" width="290" height="88" rx="12"/>
    <text class="title" x="60" y="350">Local API :8787</text>
    <text class="sub" x="60" y="372">holdings JSON, secret names</text>
    <text class="sub" x="60" y="392">host MCP, workflows, chat</text>
  </g>

  <path class="arrow" d="M348 250 H392 M384 242 L393 250 L384 258"/>

  <text class="col" x="600" y="48">Host binds, then writes the prompt</text>
  <rect x="410" y="58" width="380" height="510" rx="16" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
  <text x="426" y="80" class="title">Host <tspan class="sub" font-weight="400">Electron + Cursor SDK</tspan></text>

  <text class="sect" x="426" y="102">BINDS · not in the prompt</text>
  <g class="blue">
    <g data-tip="secrets.bin in App data. Host decrypts and fills MCP ${env:NAME}. list_secret_names returns names. Values never enter the model or the prompt.">
      <rect x="426" y="110" width="348" height="28" rx="6"/><text class="lname" x="440" y="129">secrets.bin</text><text class="ldesc" x="760" y="129">host-only values</text>
    </g>
    <g data-tip="Human architecture. Not inlined. Click to open. Agents load skill tecadrisebot when asked how the app works." data-doc="ARCHITECTURE.md">
      <rect x="426" y="142" width="348" height="28" rx="6"/><text class="lname" x="440" y="161">ARCHITECTURE.md</text><text class="ldesc" x="760" y="161">human docs</text>
    </g>
  </g>
  <g class="purple">
    <g data-tip="Connected apps + MCP catalog for every agent, plus this agent's JSON and tecadrise-host. Bound as tools, not pasted as a name list.">
      <rect x="426" y="174" width="348" height="28" rx="6"/><text class="lname" x="440" y="193">MCP shared</text><text class="ldesc" x="760" y="193">tool schemas</text>
    </g>
    <g data-tip="Cursor SDK builtins plus bound MCP. Schemas are billed by the SDK. If a tool is not in the list, the agent does not have it.">
      <rect x="426" y="206" width="348" height="28" rx="6"/><text class="lname" x="440" y="225">SDK + bound tools</text><text class="ldesc" x="760" y="225">schemas billed</text>
    </g>
  </g>

  <text class="sect" x="426" y="258">IN THE AGENT PROMPT</text>

  <g class="blue">
    <g data-tip="Global system prompt (SYSTEM.md). Inlined every turn. Click to open." data-doc="SYSTEM.md">
      <rect x="426" y="268" width="348" height="28" rx="6"/><text class="lname" x="440" y="287">SYSTEM.md</text><text class="ldesc" x="760" y="287">full text</text>
    </g>
    <g data-tip="How to use shared vs private memory (MEMORY.md). Inlined every turn. Click to open." data-doc="MEMORY.md">
      <rect x="426" y="300" width="348" height="28" rx="6"/><text class="lname" x="440" y="319">MEMORY.md</text><text class="ldesc" x="760" y="319">full text</text>
    </g>
    <g data-tip="You are this agent (name, id, model). Live workspace path and shared memory directory path.">
      <rect x="426" y="332" width="348" height="28" rx="6"/><text class="lname" x="440" y="351">Identity + paths</text><text class="ldesc" x="760" y="351">this install</text>
    </g>
    <g data-tip="Skills index: name + one line. The agent opens SKILL.md when that skill helps. Product skill: tecadrisebot.">
      <rect x="426" y="364" width="348" height="28" rx="6"/><text class="lname" x="440" y="383">Skills index</text><text class="ldesc" x="760" y="383">names</text>
    </g>
  </g>
  <g class="purple">
    <g data-tip="This agent's sticky rules. Agent gear, Soul. Never put secrets in Soul.">
      <rect x="426" y="396" width="348" height="28" rx="6"/><text class="lname" x="440" y="415">Soul</text><text class="ldesc" x="760" y="415">this agent</text>
    </g>
    <g data-tip="Workflow checklist or kickoff/review/fix text. Empty on a normal chat turn.">
      <rect x="426" y="428" width="348" height="28" rx="6"/><text class="lname" x="440" y="447">Turn extra</text><text class="ldesc" x="760" y="447">workflow only</text>
    </g>
  </g>
  <g class="orange">
    <g data-tip="Today UTC date. Last in the host block so the rest can cache.">
      <rect x="426" y="460" width="348" height="28" rx="6"/><text class="lname" x="440" y="479">Today UTC</text><text class="ldesc" x="760" y="479">last</text>
    </g>
    <g data-tip="Last N visible messages. Agent gear, Last messages.">
      <rect x="426" y="492" width="348" height="28" rx="6"/><text class="lname" x="440" y="511">Recent chat</text><text class="ldesc" x="760" y="511">last N</text>
    </g>
    <g data-tip="The user, routine, or interbot text that started this turn. Footer lists tools actually called.">
      <rect x="426" y="524" width="348" height="28" rx="6"/><text class="lname" x="440" y="543">This message</text><text class="ldesc" x="760" y="543">user text</text>
    </g>
  </g>

  <path class="arrow" d="M808 250 H852 M844 242 L853 250 L844 258"/>

  <text class="col" x="1015" y="58">Works in</text>
  <g data-tip="App data, workspaces, agent id. The only place the agent writes files. memory.md is private. Never write secrets here.">
    <rect class="card" x="870" y="70" width="290" height="72" rx="12"/>
    <text class="title" x="890" y="98">Own workspace</text><text class="sub" x="890" y="122">Files, memory.md</text>
  </g>
  <g data-tip="App data, memory: index.md, notes/, log.md. Path is in the prompt. The agent decides when to read. No secrets.">
    <rect class="card" x="870" y="154" width="290" height="72" rx="12"/>
    <text class="title" x="890" y="182">Shared memory</text><text class="sub" x="890" y="206">All agents · MEMORY.md</text>
  </g>
  <g data-tip="Runner does one step. App runs hard checks. Owner reviews and fixes, never runs. Workflow MCP attaches every turn.">
    <rect class="card" x="870" y="238" width="290" height="72" rx="12"/>
    <text class="title" x="890" y="266">Workflows</text><text class="sub" x="890" y="290">Runner runs, Owner fixes</text>
  </g>
  <g data-tip="Settings → Connectors. Attached on every work turn when connected. Every agent can use them. Off: show_connector opens this pane.">
    <rect class="card" x="870" y="322" width="290" height="72" rx="12"/>
    <text class="title" x="890" y="350">Connectors</text><text class="sub" x="890" y="374">all agents · or Connect UI</text>
  </g>
  <g data-tip="Settings → API Keys. Host decrypts. Names via list_secret_names. GET /api/secrets/:name is 403. Cursor key is host-only.">
    <rect class="card" x="870" y="406" width="290" height="72" rx="12"/>
    <text class="title" x="890" y="434">secrets.bin</text><text class="sub" x="890" y="458">host fills MCP env</text>
  </g>
</svg>
