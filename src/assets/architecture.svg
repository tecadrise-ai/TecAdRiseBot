<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <style>
    .card { fill: #ffffff; stroke: #e3e3e6; stroke-width: 1; }
    .title { font-size: 16px; font-weight: 600; fill: #1a1a1a; }
    .sub { font-size: 14px; fill: #6b6b70; }
    .col { font-size: 14px; fill: #6b6b70; text-anchor: middle; }
    .arrow { fill: none; stroke: #6b6b70; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .lname { font-size: 13px; }
    .ldesc { font-size: 12px; text-anchor: end; }
    .blue rect { fill: #dbe6fd; } .blue text { fill: #1e3a8a; }
    .purple rect { fill: #e8e6fb; } .purple text { fill: #4c3f91; }
    .orange rect { fill: #fbdccc; } .orange text { fill: #9a3412; }
    .legend { font-size: 13px; fill: #3a3a3f; }
    [data-tip] { cursor: help; }
    [data-doc] { cursor: pointer; }
    [data-doc]:hover .lname { text-decoration: underline; }
    [data-tip]:hover rect { stroke: #1d4ed8; stroke-width: 1.5; }
  </style>

  <rect width="1200" height="640" fill="#f6f6f7"/>

  <g transform="translate(40 24)">
    <rect x="0" y="-10" width="11" height="11" rx="3" fill="#3b6fe0"/><text class="legend" x="18" y="0">App-wide</text>
    <rect x="108" y="-10" width="11" height="11" rx="3" fill="#8b80e0"/><text class="legend" x="126" y="0">This agent</text>
    <rect x="210" y="-10" width="11" height="11" rx="3" fill="#e8743b"/><text class="legend" x="228" y="0">This message</text>
  </g>

  <text class="col" x="185" y="58">Starts a turn</text>
  <g data-tip="You type in chat. One agent, one in-flight turn.">
    <rect class="card" x="40" y="70" width="290" height="72" rx="12"/>
    <text class="title" x="60" y="98">You</text><text class="sub" x="60" y="122">Chat message</text>
  </g>
  <g data-tip="Per-agent schedule. Task, todos, or a step workflow with this agent as Runner.">
    <rect class="card" x="40" y="154" width="290" height="72" rx="12"/>
    <text class="title" x="60" y="182">Routine</text><text class="sub" x="60" y="206">Schedule, workflow</text>
  </g>
  <g data-tip="Host tool message_agent. Target must be idle. Do not curl the control plane for this.">
    <rect class="card" x="40" y="238" width="290" height="72" rx="12"/>
    <text class="title" x="60" y="266">Other agent</text><text class="sub" x="60" y="290">message_agent</text>
  </g>
  <g data-tip="http://127.0.0.1:8787, local only. GET /api catalog. GET /api/awareness is JSON holdings (names, no values). GET /api/secrets lists names. GET /api/secrets/NAME is 403. Secrets stay in the host.">
    <rect class="card" x="40" y="322" width="290" height="88" rx="12"/>
    <text class="title" x="60" y="350">Local API :8787</text>
    <text class="sub" x="60" y="372">holdings JSON, secret names</text>
    <text class="sub" x="60" y="392">host MCP, workflows, chat</text>
  </g>

  <path class="arrow" d="M348 250 H392 M384 242 L393 250 L384 258"/>

  <text class="col" x="600" y="48">Host binds this agent’s holdings</text>
  <rect x="410" y="58" width="380" height="554" rx="16" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
  <g data-tip="Named agent. Prompt is identity + Soul + holdings. Tools are already bound.">
    <rect x="420" y="64" width="360" height="24" fill="transparent"/>
    <text x="426" y="82" class="title">Host <tspan class="sub" font-weight="400">Electron + Cursor SDK</tspan></text>
  </g>

  <g class="blue">
    <g data-tip="Short identity: you are this agent in TecAdRiseBot, workspace path, write only here. Not ARCHITECTURE.md and not an [App] dump.">
      <rect x="426" y="92" width="348" height="32" rx="7"/><text class="lname" x="440" y="113">Identity</text><text class="ldesc" x="760" y="113">holdings prompt</text>
    </g>
    <g data-tip="secrets.bin in App data. Host decrypts and fills MCP ${env:NAME}. list_secret_names returns names. Values never enter the model.">
      <rect x="426" y="128" width="348" height="32" rx="7"/><text class="lname" x="440" y="149">secrets.bin</text><text class="ldesc" x="760" y="149">host-only values</text>
    </g>
    <g data-tip="Human Settings document. Not inlined every turn. Click to open." data-doc="SYSTEM.md">
      <rect x="426" y="164" width="348" height="32" rx="7"/><text class="lname" x="440" y="185">SYSTEM.md</text><text class="ldesc" x="760" y="185">Settings, not prompt</text>
    </g>
    <g data-tip="Human Settings document for shared vs private memory. Click to open." data-doc="MEMORY.md">
      <rect x="426" y="200" width="348" height="32" rx="7"/><text class="lname" x="440" y="221">MEMORY.md</text><text class="ldesc" x="760" y="221">Settings, not prompt</text>
    </g>
    <g data-tip="Human architecture. Click to open. Agents load skill tecadrisebot when asked how the app works." data-doc="ARCHITECTURE.md">
      <rect x="426" y="236" width="348" height="32" rx="7"/><text class="lname" x="440" y="257">ARCHITECTURE.md</text><text class="ldesc" x="760" y="257">human docs</text>
    </g>
    <g data-tip="Todo spelling only if those tools exist. Workflow turns replace this with step rules.">
      <rect x="426" y="272" width="348" height="32" rx="7"/><text class="lname" x="440" y="293">Todos</text><text class="ldesc" x="760" y="293">if the tool exists</text>
    </g>
    <g data-tip="Skills index (name + one line). Open SKILL.md when the user names a skill. Product skill: tecadrisebot.">
      <rect x="426" y="308" width="348" height="32" rx="7"/><text class="lname" x="440" y="329">Skills index</text><text class="ldesc" x="760" y="329">body on demand</text>
    </g>
  </g>
  <g class="purple">
    <g data-tip="This agent's sticky rules. Agent gear, Soul. Never put secrets in Soul.">
      <rect x="426" y="344" width="348" height="32" rx="7"/><text class="lname" x="440" y="365">Soul</text><text class="ldesc" x="760" y="365">this agent</text>
    </g>
    <g data-tip="Connected apps + MCP catalog for every agent, plus this agent's JSON and tecadrise-host. The model chooses whether to call a tool.">
      <rect x="426" y="380" width="348" height="32" rx="7"/><text class="lname" x="440" y="401">MCP shared</text><text class="ldesc" x="760" y="401">all agents</text>
    </g>
    <g data-tip="Cursor SDK builtins (shell, read, grep, todos) cannot be stripped. Connected apps and catalog schemas attach every turn. Use a tool only when the task needs it.">
      <rect x="426" y="416" width="348" height="32" rx="7"/><text class="lname" x="440" y="437">SDK + bound tools</text><text class="ldesc" x="760" y="437">schemas billed</text>
    </g>
  </g>
  <g class="orange">
    <g data-tip="Last N visible messages. Agent gear, Last messages.">
      <rect x="426" y="452" width="348" height="32" rx="7"/><text class="lname" x="440" y="473">Recent chat</text><text class="ldesc" x="760" y="473">last N</text>
    </g>
    <g data-tip="The message that started this turn. Footer lists tools actually called: [Zoho, Playwright].">
      <rect x="426" y="488" width="348" height="32" rx="7"/><text class="lname" x="440" y="509">Message</text><text class="ldesc" x="760" y="509">used tools in footer</text>
    </g>
  </g>
  <line x1="426" y1="532" x2="774" y2="532" stroke="#e3e3e6"/>
  <g data-tip="A capability is a tool the host already bound. Do not grep the app folder. Do not decrypt secrets.bin.">
    <rect x="420" y="538" width="360" height="28" fill="transparent"/>
    <text class="sub" x="426" y="558">If it is not in the tool list, you do not have it</text>
  </g>

  <path class="arrow" d="M808 250 H852 M844 242 L853 250 L844 258"/>

  <text class="col" x="1015" y="58">Works in</text>
  <g data-tip="App data, workspaces, agent id. The only place the agent writes files. memory.md is private. Never write secrets here.">
    <rect class="card" x="870" y="70" width="290" height="72" rx="12"/>
    <text class="title" x="890" y="98">Own workspace</text><text class="sub" x="890" y="122">Files, memory.md</text>
  </g>
  <g data-tip="App data, memory: index.md, notes/, log.md. Facts every agent should know. No secrets.">
    <rect class="card" x="870" y="154" width="290" height="72" rx="12"/>
    <text class="title" x="890" y="182">Shared memory</text><text class="sub" x="890" y="206">All agents · index.md first</text>
  </g>
  <g data-tip="Runner does one step. App runs hard checks. Owner reviews and fixes, never runs. Workflow MCP only when the job or an active run needs it.">
    <rect class="card" x="870" y="238" width="290" height="72" rx="12"/>
    <text class="title" x="890" y="266">Workflows</text><text class="sub" x="890" y="290">Runner runs, Owner fixes</text>
  </g>
  <g data-tip="Settings → Connectors. Attached on every work turn when connected. Every agent can use them. Off: show_connector opens this pane.">
    <rect class="card" x="870" y="322" width="290" height="72" rx="12"/>
    <text class="title" x="890" y="350">Connectors</text><text class="sub" x="890" y="374">all agents · or Connect UI</text>
  </g>
  <g data-tip="Settings → API Keys. Host decrypts. Names via list_secret_names. GET /api/secrets/:name is 403. Cursor key is host-only.">
    <rect class="card" x="870" y="406" width="290" height="72" rx="12"/>
    <text class="title" x="890" y="434">secrets.bin</text><text class="sub" x="890" y="458">host fills MCP env</text>
  </g>
</svg>
